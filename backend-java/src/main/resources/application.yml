server:
  port: 5000

spring:
  datasource:
    url: jdbc:h2:file:./data/library;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

library:
  borrow-duration-days: 14   # 借阅期限（天数），到期未还将标记为逾期
  max-borrow-count: 5        # 每位用户同时最多可借册数

jwt:
  secret: LibraryManagementSystemSecretKey2024ForJWTToken
  expiration: 86400000
